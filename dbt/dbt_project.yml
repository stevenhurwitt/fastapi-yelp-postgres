name: 'yelp_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'yelp_analytics'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  yelp_analytics:
    # Config indicated by + and applies to all files under models/staging/
    staging:
      +materialized: view
      +schema: staging
    
    # Config applies to all files under models/intermediate/
    intermediate:
      +materialized: view
      +schema: intermediate
    
    # Config applies to all files under models/marts/
    marts:
      +materialized: table
      +schema: marts

# Set the timezone for timestamp functions
on-run-start:
  - "SET timezone TO 'UTC'"
