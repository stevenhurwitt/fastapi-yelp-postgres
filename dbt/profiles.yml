# DBT Profile Configuration for Yelp Analytics
# Copy this to ~/.dbt/profiles.yml or set DBT_PROFILES_DIR environment variable

yelp_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', '192.168.0.9') }}"
      user: "{{ env_var('DB_USER', 'steven') }}"
      password: "{{ env_var('DB_PASSWORD', 'Secret!1234') }}"
      port: "{{ env_var('DB_PORT', '5433') | int }}"
      dbname: "{{ env_var('DB_NAME', 'steven') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      
    prod:
      type: postgres
      host: "{{ env_var('DB_HOST', '192.168.0.9') }}"
      user: "{{ env_var('DB_USER', 'steven') }}"
      password: "{{ env_var('DB_PASSWORD', 'Secret!1234') }}"
      port: "{{ env_var('DB_PORT', '5433') | int }}"
      dbname: "{{ env_var('DB_NAME', 'steven') }}"
      schema: public
      threads: 8
      keepalives_idle: 0
      connect_timeout: 10
